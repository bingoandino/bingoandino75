name: Pruebas de sesiones del administrador
on:
  push:
    paths: ['supabase/functions/admin-auth/**', 'supabase/admin-dos-sesiones.sql', 'tests/admin-sessions.test.cjs', '.github/workflows/pruebas-admin-sesiones.yml']
  pull_request:
    paths: ['supabase/functions/admin-auth/**', 'supabase/admin-dos-sesiones.sql', 'tests/admin-sessions.test.cjs', '.github/workflows/pruebas-admin-sesiones.yml']
jobs:
  sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/admin-sessions.test.cjs
