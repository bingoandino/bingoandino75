name: Pruebas del slot de premios
on:
  push:
    paths: ['slot/**', 'supabase/functions/slot-premios/**', 'tests/slot-premios.test.mjs']
  pull_request:
    paths: ['slot/**', 'supabase/functions/slot-premios/**', 'tests/slot-premios.test.mjs']
jobs:
  slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/slot-premios.test.mjs
