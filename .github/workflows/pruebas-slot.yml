name: Pruebas del slot de premios
on:
  push:
    paths: ['slot/**', 'supabase/functions/slot-premios/**', 'tests/slot-*.test.mjs', 'tests/slot-*.test.cjs', 'supabase/slot-cartones-gratis.sql', '.github/workflows/pruebas-slot.yml']
  pull_request:
    paths: ['slot/**', 'supabase/functions/slot-premios/**', 'tests/slot-*.test.mjs', 'tests/slot-*.test.cjs', 'supabase/slot-cartones-gratis.sql', '.github/workflows/pruebas-slot.yml']
jobs:
  slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/slot-*.test.mjs tests/slot-*.test.cjs
